[project]
name = "nhtsa-stats"
version = "0.1.0"
description = "Reproducible research on US road-crash severity, fatal-crash risk structure and road-safety intervention scenarios using NHTSA FARS and CRSS (2016-2024)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "polars>=1.20,<2",
    "pyarrow>=17",
    "pandas>=3.0",  # copy-on-write semantics are relied upon (survey.margin_influence)
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14.4",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "altair>=5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pytest-cov>=5"]

[project.scripts]
nhtsa = "nhtsa_stats.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nhtsa_stats"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD002", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "data: tests that require the interim Parquet cache built from data/raw (skipped when absent)",
    "processed: tests that require the processed analytic datasets (skipped when absent)",
    "slow: slow tests",
]
